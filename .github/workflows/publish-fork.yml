name: Publish fork (aar0u)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ vars.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | base64 -d > main/signingkey.jks

      - name: Build extensions
        env:
          ALIAS: ${{ vars.ALIAS }}
          KEY_STORE_PASSWORD: ${{ vars.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ vars.KEY_PASSWORD }}
        working-directory: main
        run: |
          TASKS=()
          for module in $(< .github/extensions.txt); do
            TASKS+=("${module}:generateSourceInfo" "${module}:packageRelease")
          done
          ./gradlew "${TASKS[@]}"

      - name: Checkout repository branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aar0u/manga-extensions
          ref: repo
          path: repo
          token: ${{ github.token }}

      - name: Publish repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          pip install protobuf
          python -u ../main/.github/scripts/publish-repo-fork.py "[]" "$GITHUB_SHA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update extensions repository"
            git push
            curl https://purge.jsdelivr.net/gh/aar0u/manga-extensions@repo/index.json
            curl https://purge.jsdelivr.net/gh/aar0u/manga-extensions@repo/index.pb

            current="${GITHUB_SHA::7}"
            gh api "repos/aar0u/manga-extensions/releases" --paginate --jq '.[].tag_name' | while read -r tag; do
              if [[ "$tag" != "$current" && "$tag" != "$current-"* ]]; then
                echo "Deleting release $tag"
                gh release delete "$tag" --repo aar0u/manga-extensions --yes --cleanup-tag
              fi
            done
          fi
